<!-- 现代化首页头部 -->
<div class="hero min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
    <div class="hero-content text-center">
        <div class="max-w-4xl">
            <!-- 主要标题区域 -->
            <div class="mb-8 animate-fade-in">
                <h1 class="text-5xl font-bold text-gray-900 mb-4">
                    发现你的校园生活
                </h1>
                <p class="text-xl text-gray-600 mb-8">
                    连接兴趣，分享经历，发现机会，让校园生活更加精彩
                </p>

                <!-- 快速统计 -->
                <div class="stats stats-vertical lg:stats-horizontal shadow-lg bg-white/80 backdrop-blur-sm mb-8">
                    <div class="stat">
                        <div class="stat-figure text-primary">
                            <svg class="inline-block w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <div class="stat-title">活动总数</div>
                        <div class="stat-value text-primary" id="totalActivities">0</div>
                        <div class="stat-desc">不断增长中</div>
                    </div>

                    <div class="stat">
                        <div class="stat-figure text-secondary">
                            <svg class="inline-block w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                            </svg>
                        </div>
                        <div class="stat-title">活跃用户</div>
                        <div class="stat-value text-secondary" id="activeUsers">0</div>
                        <div class="stat-desc">今日在线</div>
                    </div>

                    <div class="stat">
                        <div class="stat-figure text-accent">
                            <svg class="inline-block w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                        </div>
                        <div class="stat-title">讨论话题</div>
                        <div class="stat-value text-accent" id="totalPosts">0</div>
                        <div class="stat-desc">精彩内容</div>
                    </div>
                </div>
            </div>

            <!-- 搜索区域 -->
            <div class="bg-white/80 backdrop-blur-lg rounded-2xl shadow-2xl p-8 animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">开始探索</h2>

                <!-- 搜索框 -->
                <div class="form-control mb-6">
                    <div class="input-group">
                        <input type="text"
                               id="searchInput"
                               placeholder="搜索活动、论坛、团队..."
                               class="input input-bordered input-lg flex-1 focus:input-primary transition-all duration-200"
                               onkeypress="if(event.key === 'Enter') searchAll()">
                        <button class="btn btn-primary btn-lg" onclick="searchAll()">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            搜索
                        </button>
                    </div>
                </div>

                <!-- 快速筛选 -->
                <div class="flex flex-wrap gap-3 justify-center mb-6">
                    <div class="badge badge-primary badge-lg cursor-pointer hover:badge-primary-focus transition-colors" onclick="filterByCategory('学术')">
                        🎓 学术活动
                    </div>
                    <div class="badge badge-secondary badge-lg cursor-pointer hover:badge-secondary-focus transition-colors" onclick="filterByCategory('体育')">
                        ⚽ 体育运动
                    </div>
                    <div class="badge badge-accent badge-lg cursor-pointer hover:badge-accent-focus transition-colors" onclick="filterByCategory('艺术')">
                        🎨 艺术文化
                    </div>
                    <div class="badge badge-neutral badge-lg cursor-pointer hover:badge-neutral-focus transition-colors" onclick="filterByCategory('社交')">
                        👥 社交聚会
                    </div>
                    <div class="badge badge-info badge-lg cursor-pointer hover:badge-info-focus transition-colors" onclick="showNearby()">
                        📍 附近活动
                    </div>
                </div>

                <!-- 快速操作按钮 -->
                <div class="flex flex-wrap gap-4 justify-center">
                    <a href="/create-activity" class="btn btn-primary btn-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        发布活动
                    </a>
                    <a href="/create-post" class="btn btn-outline btn-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        发表帖子
                    </a>
                    <a href="/groups" class="btn btn-outline btn-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        加入小组
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
