<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队招募 - 校园社交匹配</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .recruit-card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .recruit-card:hover {
            transform: translateY(-2px);
        }
        .recruit-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .skill-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            margin: 0.125rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">校园平台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/forum">论坛</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/groups">小组</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/team-recruit">团队招募</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/friends">好友</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/messages">消息</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <span id="usernameDisplay">加载中...</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/profile">个人中心</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面头部 -->
    <div class="recruit-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h1 class="display-4 fw-bold mb-3">团队招募</h1>
                    <p class="lead mb-0">寻找志同道合的伙伴，一起完成项目</p>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <button class="btn btn-light btn-lg" data-bs-toggle="modal" data-bs-target="#createRecruitModal">
                        <i class="fas fa-plus me-2"></i>发布招募
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 搜索和筛选 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索项目或技能...">
                    <button class="btn btn-outline-primary" onclick="searchRecruits()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="skillFilter">
                    <option value="">所有技能</option>
                    <option value="前端">前端</option>
                    <option value="后端">后端</option>
                    <option value="设计">设计</option>
                    <option value="产品">产品</option>
                    <option value="测试">测试</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="sortSelect" onchange="loadRecruits()">
                    <option value="newest">最新发布</option>
                    <option value="oldest">最早发布</option>
                </select>
            </div>
        </div>

        <!-- 招募列表 -->
        <div class="row" id="recruitsList">
            <!-- 动态加载招募卡片 -->
        </div>
    </div>

    <!-- 创建招募模态框 -->
    <div class="modal fade" id="createRecruitModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">发布团队招募</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createRecruitForm">
                        <div class="mb-3">
                            <label for="recruitTitle" class="form-label">项目标题 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="recruitTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="recruitDescription" class="form-label">项目描述</label>
                            <textarea class="form-control" id="recruitDescription" name="description" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="recruitSkills" class="form-label">所需技能（逗号分隔）</label>
                            <input type="text" class="form-control" id="recruitSkills" name="skills" 
                                   placeholder="例如：前端开发,后端开发,UI设计">
                        </div>
                        <div class="mb-3">
                            <label for="recruitTimeFrame" class="form-label">时间周期</label>
                            <input type="text" class="form-control" id="recruitTimeFrame" name="time_frame" 
                                   placeholder="例如：3个月,长期项目">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createRecruit()">发布</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 招募详情模态框 -->
    <div class="modal fade" id="recruitDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="recruitDetailTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="recruitDetailBody">
                    <!-- 动态加载内容 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadRecruits();
            
            // 绑定筛选事件
            document.getElementById('skillFilter').addEventListener('change', loadRecruits);
        });

        // 加载用户信息
        function loadUserInfo() {
            fetch('/api/current-user')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('usernameDisplay').textContent = data.data.username;
                    }
                });
        }

        // 登出
        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/login';
                    }
                });
        }

        // 加载招募列表
        function loadRecruits() {
            const skillFilter = document.getElementById('skillFilter').value;
            const sort = document.getElementById('sortSelect').value;
            
            let url = `/api/team-recruit?sort=${sort}`;
            if (skillFilter) {
                url += `&skill=${encodeURIComponent(skillFilter)}`;
            }
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayRecruits(data.data);
                    }
                });
        }

        // 显示招募
        function displayRecruits(recruits) {
            const container = document.getElementById('recruitsList');
            container.innerHTML = '';
            
            if (recruits.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-users fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">暂无团队招募</h4>
                        <p class="text-muted">来发布第一个团队招募吧！</p>
                    </div>
                `;
                return;
            }
            
            recruits.forEach(recruit => {
                const skillsHtml = recruit.skills.map(skill => 
                    `<span class="skill-tag">${skill}</span>`
                ).join('');
                
                const recruitCard = `
                    <div class="col-lg-6 mb-4">
                        <div class="card recruit-card h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${recruit.title}</h5>
                                <p class="card-text flex-grow-1">${recruit.description || '暂无描述'}</p>
                                
                                <div class="mb-2">
                                    <strong>所需技能：</strong>
                                    <div>${skillsHtml || '不限'}</div>
                                </div>
                                
                                ${recruit.time_frame ? `<div class="mb-2"><strong>时间周期：</strong>${recruit.time_frame}</div>` : ''}
                                
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <div class="text-muted small">
                                        <i class="fas fa-user me-1"></i>${recruit.creator.username} · 
                                        <i class="fas fa-users me-1"></i>${recruit.member_count}人
                                    </div>
                                    <small class="text-muted">${formatDate(recruit.created_at)}</small>
                                </div>
                                
                                <div class="mt-3">
                                    <button class="btn btn-primary w-100" onclick="viewRecruit(${recruit.id})">
                                        查看详情
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', recruitCard);
            });
        }

        // 搜索招募
        function searchRecruits() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.recruit-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                const description = card.querySelector('.card-text').textContent.toLowerCase();
                const visible = title.includes(searchTerm) || description.includes(searchTerm);
                card.style.display = visible ? 'block' : 'none';
            });
        }

        // 创建招募
        function createRecruit() {
            const form = document.getElementById('createRecruitForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            // 处理技能标签
            if (data.skills) {
                data.skills = data.skills.split(',').map(s => s.trim()).filter(s => s);
            }
            
            fetch('/api/team-recruit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('createRecruitModal')).hide();
                    form.reset();
                    loadRecruits();
                    alert('团队招募发布成功！');
                } else {
                    alert('发布失败: ' + data.error);
                }
            });
        }

        // 查看招募详情
        function viewRecruit(recruitId) {
            fetch(`/api/team-recruit/${recruitId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const recruit = data.data;
                        document.getElementById('recruitDetailTitle').textContent = recruit.title;
                        
                        const skillsHtml = recruit.skills.map(skill => 
                            `<span class="badge bg-secondary me-1">${skill}</span>`
                        ).join('');
                        
                        document.getElementById('recruitDetailBody').innerHTML = `
                            <div class="mb-3">
                                <h6>项目描述</h6>
                                <p>${recruit.description || '暂无描述'}</p>
                            </div>
                            
                            <div class="mb-3">
                                <h6>所需技能</h6>
                                <div>${skillsHtml || '不限'}</div>
                            </div>
                            
                            ${recruit.time_frame ? `<div class="mb-3"><h6>时间周期</h6><p>${recruit.time_frame}</p></div>` : ''}
                            
                            <div class="mb-3">
                                <h6>创建者</h6>
                                <p>${recruit.creator.username}</p>
                            </div>
                            
                            <div class="mb-3">
                                <h6>团队成员 (${recruit.members.length})</h6>
                                <div id="teamMembers">
                                    ${recruit.members.map(member => `
                                        <div class="d-flex align-items-center mb-2">
                                            <img src="${member.avatar || '/static/images/default.jpg'}" 
                                                 class="rounded-circle me-2" width="32" height="32">
                                            <span>${member.username}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="text-end">
                                ${recruit.is_member ? 
                                    '<button class="btn btn-danger" onclick="leaveTeam(' + recruit.id + ')">退出团队</button>' :
                                    '<button class="btn btn-success" onclick="joinTeam(' + recruit.id + ')">加入团队</button>'
                                }
                            </div>
                        `;
                        new bootstrap.Modal(document.getElementById('recruitDetailModal')).show();
                    }
                });
        }

        // 加入团队
        function joinTeam(recruitId) {
            fetch(`/api/team-recruit/${recruitId}/join`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        bootstrap.Modal.getInstance(document.getElementById('recruitDetailModal')).hide();
                        loadRecruits();
                        alert('成功加入团队！');
                    } else {
                        alert('加入失败: ' + data.error);
                    }
                });
        }

        // 退出团队
        function leaveTeam(recruitId) {
            fetch(`/api/team-recruit/${recruitId}/leave`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        bootstrap.Modal.getInstance(document.getElementById('recruitDetailModal')).hide();
                        loadRecruits();
                        alert('已退出团队！');
                    } else {
                        alert('退出失败: ' + data.error);
                    }
                });
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }
    </script>
</body>
</html></content>
