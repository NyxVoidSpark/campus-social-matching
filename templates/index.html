<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园多元活动列表</title>
    <!-- 引入 Bootstrap 样式 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 基础样式优化 */
        .user-info {
            text-align: right;
            margin-bottom: 20px;
        }
        .header {
            margin-bottom: 30px;
        }
        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
        }
        .search-box {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 25px;
            overflow: hidden;
        }
        .publish-card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .publish-card .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        /* 适配移动端布局 */
        @media (max-width: 992px) {
            .publish-card {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container activity-container py-4">
        <!-- 顶部导航栏：显示用户信息和操作按钮（优化对齐+修复图标格式） -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-light rounded">
            <div class="d-flex align-items-center">
                <h4 class="mb-0">校园活动平台</h4>
                <span class="badge bg-primary ms-2">Beta</span>
            </div>
            <!-- 用户信息区域（优化间距+修复图标标签错误） -->
            <div class="user-info d-flex align-items-center">
                <span id="usernameDisplay" class="me-2 fw-bold"></span>
                <span id="userRoleBadge" class="badge bg-success me-2"></span>
                <div class="btn-group" role="group">
                    <a href="/personal_home" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-home me-1"></i>我的
                    </a>
                    <a href="/forum" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-comments me-1"></i>论坛
                    </a>
                    <a href="/groups" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-users-cog me-1"></i>小组
                    </a>
                    <a href="/team-recruit" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-user-friends me-1"></i>团队招募
                    </a>
                    <a href="/stats" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-chart-bar me-1"></i>统计
                    </a>
                    <a href="/friends?tab=search" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-users me-1"></i>好友
                    </a>
                    <a href="/messages" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-comments me-1"></i>消息
                    </a>
                    <a href="/profile" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-user me-1"></i>个人中心
                    </a>
                    <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i>登出
                    </button>
                </div>
            </div>
        </div>

        <!-- 核心区域 1：活动类型搜索 + 活动列表（首屏优先展示活动信息） -->
        <div class="header text-center mb-4">
            <h1 class="mb-3">校园多元活动列表</h1>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <!-- 活动类型筛选按钮（规整格式+优化对齐） -->
                    <div class="d-flex justify-content-center flex-wrap mb-3">
                        <span class="me-2 align-self-center fw-medium">活动类型:</span>
                        <div id="activityTypeButtons" class="btn-group" role="group">
                            <!-- 动态填充筛选按钮：全部/学术/体育/艺术/其他 -->
                            <button type="button" class="btn btn-outline-primary" onclick="handleFilterActivities('all')">全部</button>
                            <button type="button" class="btn btn-outline-primary" onclick="handleFilterActivities('学术')">学术</button>
                            <button type="button" class="btn btn-outline-primary" onclick="handleFilterActivities('体育')">体育</button>
                            <button type="button" class="btn btn-outline-primary" onclick="handleFilterActivities('艺术')">艺术</button>
                            <button type="button" class="btn btn-outline-primary" onclick="handleFilterActivities('其他')">其他</button>
                        </div>
                    </div>
                    
                    <!-- 搜索与高级筛选选项 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-8 mx-auto">
                            <!-- 搜索框 -->
                            <label for="searchInput" class="form-label small">搜索关键词</label>
                            <div class="input-group">
                                <input type="text" id="searchInput" class="form-control"
                                       placeholder="搜索活动名称或地点..."
                                       onkeypress="if(event.key === 'Enter') handleSearchActivities()">
                                <button class="btn btn-primary" onclick="handleSearchActivities()">
                                    <i class="fas fa-search me-1"></i>搜索
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="dateFromFilter" class="form-label small">开始日期</label>
                            <input type="date" class="form-control form-control-sm" id="dateFromFilter">
                        </div>
                        <div class="col-md-4">
                            <label for="dateToFilter" class="form-label small">结束日期</label>
                            <input type="date" class="form-control form-control-sm" id="dateToFilter">
                        </div>
                        <div class="col-md-4">
                            <label for="sortFilter" class="form-label small">排序</label>
                            <select class="form-select form-select-sm" id="sortFilter">
                                <option value="newest">最新发布</option>
                                <option value="upcoming">即将开始</option>
                                <option value="most_participants">参与最多</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- 筛选按钮 -->
                    <div class="d-flex justify-content-center gap-2 mb-4">
                        <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">
                            <i class="fas fa-times me-1"></i>清除筛选
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="applyAdvancedFilters()">
                            <i class="fas fa-filter me-1"></i>应用筛选
                        </button>
                    </div>
                    
                    <!-- 活动列表区域（加载占位） -->
                    <div class="row" id="activity-list">
                        <div class="col-12 text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-3">正在加载活动数据...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 核心区域 2：左侧发布活动 + 右侧发布帖子（修复布局嵌套+修正Bootstrap类） -->
        <div class="row mb-5"> <!-- 修正：mb-6 改为 Bootstrap 有效类 mb-5 -->
            <!-- 左侧：发布活动（占 4 列） -->
            <div class="col-lg-4 mb-4">
                <div class="card publish-card">
                    <div class="card-header">
                        <strong><i class="fas fa-calendar-plus"></i> 发布活动</strong>
                    </div>
                    <div class="card-body">
                        <form id="activityForm">
                            <div class="mb-3">
                                <label for="activityTitle" class="form-label">活动标题 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="activityTitle" name="title" placeholder="例如 校园篮球赛" required>
                            </div>
                            <div class="mb-3">
                                <label for="activityType" class="form-label">活动类型 <span class="text-danger">*</span></label>
                                <select class="form-select" id="activityType" name="type" required>
                                    <option value="">请选择类型</option>
                                    <option value="学术">学术</option>
                                    <option value="体育">体育</option>
                                    <option value="艺术">艺术</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="activityTime" class="form-label">活动时间 <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="activityTime" name="time" required>
                            </div>
                            <div class="mb-3">
                                <label for="activityLocation" class="form-label">活动地点 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="activityLocation" name="location" placeholder="例如 学校体育馆" required>
                            </div>
                            <div class="mb-3">
                                <label for="activityTags" class="form-label">活动标签（逗号分隔）</label>
                                <input type="text" class="form-control" id="activityTags" name="tags" placeholder="例如 篮球,运动,团队">
                            </div>
                            <div class="mb-3">
                                <label for="activityDesc" class="form-label">活动描述</label>
                                <textarea class="form-control" id="activityDesc" name="description" rows="3" placeholder="活动详情介绍"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-paper-plane"></i> 发布活动
                            </button>
                            <div id="activityFormMsg" class="mt-2"></div>
                        </form>
                    </div>
                </div>
            </div> 

            <!-- 右侧：发布帖子（占 8 列） -->
            <div class="col-lg-8">
                <div class="card publish-card">
                    <div class="card-header">
                        <strong><i class="fas fa-pen-to-square"></i> 发布帖子</strong>
                    </div>
                    <div class="card-body">
                        <form id="postForm">
                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label for="postTitle" class="form-label">帖子标题 <span class="text-danger">*</span></label>
                                    <input class="form-control" id="postTitle" name="title" placeholder="例如 二手教材转让" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="postCategory" class="form-label">帖子分类 <span class="text-danger">*</span></label>
                                    <select id="postCategory" class="form-select" name="category" required>
                                        <option value="">请选择分类</option>
                                        <option value="教学科研">教学科研</option>
                                        <option value="校园活动">校园活动</option>
                                        <option value="生活服务">生活服务</option>
                                        <option value="求职就业">求职就业</option>
                                        <option value="学术交流">学术交流</option>
                                        <option value="兴趣社群">兴趣社群</option>
                                        <option value="求助问答">求助问答</option>
                                        <option value="校园资讯">校园资讯</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="postContent" class="form-label">帖子内容（支持Markdown）</label>
                                <textarea id="postContent" class="form-control" name="content" rows="6" placeholder="详细内容描述" required></textarea>
                            </div>
                            <div id="postMetadata" class="mb-3"></div>
                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label for="postTags" class="form-label">帖子标签（逗号分隔）</label>
                                    <input class="form-control" id="postTags" name="tags" placeholder="例如 二手,教材,计算机">
                                </div>
                                <div class="col-md-4">
                                    <label for="postFiles" class="form-label">上传附件（可选）</label>
                                    <input type="file" id="postFiles" name="files" multiple class="form-control">
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" id="checkSimilarBtn" class="btn btn-outline-secondary flex-1">
                                    <i class="fas fa-search"></i> 检查相似帖子
                                </button>
                                <button type="submit" class="btn btn-primary flex-1">
                                    <i class="fas fa-paper-plane"></i> 发布帖子
                                </button>
                            </div>
                            <div id="postFormMsg" class="mt-2"></div>
                        </form>
                    </div>
                </div>

                <!-- 帖子筛选搜索功能 -->
                <div class="card mt-4">
                    <div class="card-header">
                        <strong><i class="fas fa-search"></i> 帖子筛选搜索</strong>
                    </div>
                    <div class="card-body">
                        <!-- 帖子类型筛选按钮 -->
                        <div class="d-flex justify-content-center flex-wrap mb-3">
                            <span class="me-2 align-self-center fw-medium">帖子类型:</span>
                            <div id="postTypeButtons" class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('all')">全部</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('教学科研')">教学科研</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('校园活动')">校园活动</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('生活服务')">生活服务</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('求职就业')">求职就业</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('学术交流')">学术交流</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('兴趣社群')">兴趣社群</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('求助问答')">求助问答</button>
                                <button type="button" class="btn btn-outline-primary" onclick="filterPosts('校园资讯')">校园资讯</button>
                            </div>
                        </div>
                        
                        <!-- 帖子搜索框 -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-8 mx-auto">
                                <label for="postSearchInput" class="form-label small">搜索关键词</label>
                                <div class="input-group">
                                    <input type="text" id="postSearchInput" class="form-control"
                                           placeholder="搜索帖子标题或内容..."
                                           onkeypress="if(event.key === 'Enter') searchPosts()">
                                    <button class="btn btn-primary" onclick="searchPosts()">
                                        <i class="fas fa-search me-1"></i>搜索
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 筛选按钮 -->
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="clearPostFilters()">
                                <i class="fas fa-times me-1"></i>清除筛选
                            </button>
                            <button class="btn btn-primary btn-sm" onclick="applyPostFilters()">
                                <i class="fas fa-filter me-1"></i>应用筛选
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 帖子信息流 -->
                <div class="card mt-4">
                    <div class="card-header">
                        <strong><i class="fas fa-stream"></i> 帖子信息流</strong>
                    </div>
                    <div class="card-body">
                        <div id="postsList" class="list-group"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 帖子详情模态框（修复嵌套错误+规整格式） -->
    <div class="modal fade" id="postDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="postDetailTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="postDetailBody">
                    <!-- 内容由 JS 填充 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 活动详情模态框 -->
    <div class="modal fade" id="activityDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="activityDetailTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="activityDetailBody">
                    <!-- 内容由 JS 填充 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-success" id="joinActivityBtn">
                        <i class="fas fa-user-plus mr-1"></i>报名活动
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 报名活动表单模态框 -->
    <div class="modal fade" id="joinActivityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">报名活动</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="joinActivityForm">
                        <div class="mb-3">
                            <label for="participantName" class="form-label">姓名</label>
                            <input type="text" class="form-control" id="participantName" required>
                        </div>
                        <div class="mb-3">
                            <label for="participantPhone" class="form-label">手机号码</label>
                            <input type="tel" class="form-control" id="participantPhone" required>
                        </div>
                        <div class="mb-3">
                            <label for="participantEmail" class="form-label">电子邮箱</label>
                            <input type="email" class="form-control" id="participantEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="participantMessage" class="form-label">备注信息</label>
                            <textarea class="form-control" id="participantMessage" rows="3"></textarea>
                        </div>
                        <input type="hidden" id="joinActivityId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitJoinActivityForm()">提交报名</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- 引入业务逻辑 JS（根据实际路径调整） -->
    <script src="{{ url_for('static', filename='js/main.js') }}" charset="UTF-8"></script>
    <!-- 核心业务逻辑（保留所有原有功能，规整代码缩进） -->
    <script>

        // 页面加载完成后初始化用户信息
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo(); // 加载登录用户信息
            initActivityForm(); // 初始化活动发布表单
            initPostForm(); // 初始化帖子发布表单
            // 加载活动列表
            if (typeof loadActivities === 'function') {
                loadActivities();
            }
        });

        // 加载当前登录用户信息
        function loadUserInfo() {
            fetch('/api/current-user')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('usernameDisplay').textContent = data.data.username;
                        document.getElementById('userRoleBadge').textContent = data.data.role === 'teacher' ? '教师' : '学生';
                    }
                })
                .catch(error => console.error('加载用户信息失败:', error));
        }

        // 登出功能
        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/login';
                    }
                })
                .catch(error => console.error('登出失败:', error));
        }

        // 搜索活动
        function handleSearchActivities() {
            const keyword = document.getElementById('searchInput').value.trim();
            // 实际项目中替换为真实接口请求
            console.log('搜索活动：', keyword, '类型：', currentSearchType);
            // 直接调用 main.js 中的 searchActivities 函数
            if (typeof searchActivities === 'function') {
                searchActivities();
            }
        }

        // 筛选活动类型
        function handleFilterActivities(type) {
            // 直接调用 main.js 中的 filterActivities 函数
            if (typeof filterActivities === 'function') {
                filterActivities(type);
            }
        }

        // 初始化活动发布表单
        function initActivityForm() {
            const form = document.getElementById('activityForm');
            if (!form) return;
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = {
                    title: document.getElementById('activityTitle').value,
                    type: document.getElementById('activityType').value,
                    time: document.getElementById('activityTime').value,
                    location: document.getElementById('activityLocation').value,
                    tags: document.getElementById('activityTags').value,
                    description: document.getElementById('activityDesc').value
                };
                // 实际项目中替换为真实接口请求
                fetch('/api/activities', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('activityFormMsg').innerHTML = `<div class="alert alert-success">活动发布成功！</div>`;
                        form.reset(); // 重置表单
                        // 重新加载活动列表
                        if (typeof loadActivities === 'function') {
                            loadActivities();
                        }
                        setTimeout(() => document.getElementById('activityFormMsg').innerHTML = '', 3000);
                    } else {
                        document.getElementById('activityFormMsg').innerHTML = `<div class="alert alert-danger">发布失败：${data.error}</div>`;
                    }
                })
                .catch(error => {
                    console.error('发布活动失败:', error);
                    document.getElementById('activityFormMsg').innerHTML = `<div class="alert alert-danger">发布失败，请重试</div>`;
                });
            });
        }

        // 初始化帖子发布表单（简化版）
        function initPostForm() {
            const form = document.getElementById('postForm');
            if (!form) return;
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                // 实际项目中补充完整表单处理逻辑
                document.getElementById('postFormMsg').innerHTML = `<div class="alert alert-success">帖子发布成功（待审核）！</div>`;
                form.reset();
                setTimeout(() => document.getElementById('postFormMsg').innerHTML = '', 3000);
            });
            // 检查相似帖子按钮
            const checkSimilarBtn = document.getElementById('checkSimilarBtn');
            if (checkSimilarBtn) {
                checkSimilarBtn.addEventListener('click', function() {
                    document.getElementById('postFormMsg').innerHTML = `<div class="alert alert-info">未检测到相似帖子，可以发布！</div>`;
                    setTimeout(() => document.getElementById('postFormMsg').innerHTML = '', 3000);
                });
            }
        }
    </script>
</body>
</html>
